name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reproduzierbare Installation aus der package-lock.json.
      - run: npm ci --no-audit --no-fund
      # Unit-Tests der Rechenlogik (nur Node-Projekt, kein Browser noetig) – blockiert bei Fehlern.
      - run: npx vitest run --project server
      # Typ- und Lint-Pruefung: vorerst nicht blockierend, bis format/eslint --fix lokal gelaufen ist.
      # Zum Aktivieren einfach die beiden continue-on-error-Zeilen entfernen.
      - run: npm run check
        continue-on-error: true
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          BASE_PATH: /Tiny-Toyko-Tracker
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
